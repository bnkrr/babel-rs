# Optional. If absent, generated once and persisted in state_file.
# router_id = "01:02:03:04:05:06:07:08" # unique within the routing domain

# Optional. Parent directories are created; updates use fsync + atomic rename.
state_file = "/var/lib/babel-rs/state.toml"

# Optional, default 5000. Total orderly-shutdown budget; reloadable, nonzero.
shutdown_timeout_ms = 5000

# Required, ordered desired-state rules. The first matching section wins.
# Exact names, `*`, and `?` are supported; zero current matches is valid.
[[interfaces]]
# control_transport = "ipv6" # Set "ipv4" for IPv4-only control links.
match = ["eth0"] # replace with a participating interface
link_type = "wired"
# hello_interval_ms = 1000
# auto prefers an available IPv4 address; ipv4/ipv6 explicitly override it.
ipv4_next_hop = "auto"

# Optional authentication, attached inside the relevant [[interfaces]] section:
# [interfaces.mac]
# [[interfaces.mac.keys]]
# algorithm = "hmac_sha256"  # or "blake2s128"
# key_file = "/etc/babel-rs/link.key"  # hex-encoded random shared key

[[interfaces]]
match = ["tun-*", "wg*"] # optional existing tunnel interfaces
link_type = "tunnel"

# An explicit nested metric replaces the link_type metric preset atomically:
# [interfaces.metric]
# type = "rtt"
# probe_interval_ms = 2000
# Optional elapsed-time smoothing; default is per-sample alpha 0.836.
# half_life_ms = 6000
# min_rtt_ms = 10
# max_rtt_ms = 120
# max_penalty = 150
# [interfaces.metric.base]
# type = "etx"

# Optional route-switch policy. An unavailable current route is replaced
# immediately; these thresholds apply only while it remains reachable.
[route_selection]
switch_margin_percent = 5
switch_margin_metric = 8
better_for_ms = 8000

# Optional, repeatable. Replace these documentation prefixes with routes
# reachable through this host. Origins do not create local addresses/routes.
# source omitted means the family-wide default source.
[[origins]]
destination = "2001:db8:100::/64"

[[origins]]
destination = "198.51.100.0/24"
source = "10.0.0.0/8"
metric = 0

# Required Linux export policy. Reserve this protocol for this daemon only.
[export]
protocol = 203

# Optional, default false. true installs routes by output device without a
# gateway; intended for point-to-point interfaces with exactly one peer.
device_only = false

# Optional, default true. When false, another manager owns source policy rules.
manage_rules = true

# Ordinary routes use a dedicated table. The host must add IPv4/IPv6 lookup
# rules for it; see docs/guide/configuration.md. Reserved tables 0/253/254/255 are rejected.
[[export.views]]
table = 20000

# Pin an optional source view; overlapping sources are supported.
# Other learned sources automatically allocate tables from 1000000 upward.
# Views inherit covering source routes and ordinary routes.
# Rule priorities default to 10000 + 128 - source prefix length.
[[export.views]]
table = 20001
source = "10.0.0.0/8"
