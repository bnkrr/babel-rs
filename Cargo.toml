[workspace]
members = [
    "crates/babel-proto",
    "crates/babel-router",
    "crates/babel-rs",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/bnkrr/babel-rs"

[workspace.dependencies]
async-trait = "0.1.92"
babel-proto = { path = "crates/babel-proto", version = "0.1.0" }
babel-router = { path = "crates/babel-router", version = "0.1.0" }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
ipnet = { version = "2.12.1", features = ["serde"] }
libc = "0.2.189"
netlink-packet-route = "0.33.0"
rtnetlink = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
