name: e2e

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-netns:
    name: Linux netns and interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install routing daemons
        run: |
          sudo apt-get update
          sudo apt-get install --yes babeld bird2 iproute2 iputils-ping
      - name: Build daemon
        run: cargo build --locked --release --package babel-rs
      - name: Build public route policy example
        run: cargo build --locked --release --package babel-router --example route_policy
      - name: Test runtime import/export policy replacement
        run: sudo python3 tests/e2e/netns-route-policy.py "$PWD/target/release/babel-rs" "$PWD/target/release/examples/route_policy"
      - name: Test MAC authentication and overlapping SADR transit
        run: sudo python3 tests/e2e/netns-mac-sadr.py "$PWD/target/release/babel-rs"
      - name: Test babeld interoperability
        run: sudo sh tests/e2e/netns-babeld.sh "$PWD/target/release/babel-rs"
      - name: Test BIRD interoperability
        run: sudo sh tests/e2e/netns-bird.sh "$PWD/target/release/babel-rs"
      - name: Test IPv4 control, independent RTT and unnumbered ICMPv4
        run: sudo python3 tests/e2e/netns-rfc-boundaries.py "$PWD/target/release/babel-rs"
      - name: Test shared LAN, IPv4 next-hop policies and asymmetric loss
        run: sudo python3 tests/e2e/netns-general.py "$PWD/target/release/babel-rs"
      - name: Test three-node convergence
        run: sudo sh tests/e2e/netns-three-node.sh "$PWD/target/release/babel-rs"
      - name: Test RFC 9616 RTT metric
        run: sudo sh tests/e2e/netns-rtt.sh "$PWD/target/release/babel-rs"
      - name: Test delayed multipath RTT selection
        run: sudo bash tests/e2e/netns-rtt-multipath.sh "$PWD/target/release/babel-rs"
      - name: Test lifecycle and FIB reconciliation
        run: sudo sh tests/e2e/netns-lifecycle.sh "$PWD/target/release/babel-rs"
      - name: Test live MTU packetisation and output scheduling
        run: sudo sh tests/e2e/netns-mtu-output.sh "$PWD/target/release/babel-rs"

  robustness:
    name: Robustness (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [capacity, state-restart, shutdown-recovery, control-clients, combined-failures]
    steps:
      - uses: actions/checkout@v7
      - name: Install network test tools
        run: sudo apt-get update && sudo apt-get install --yes iproute2 iputils-ping
      - name: Build daemon
        run: cargo build --locked --release --package babel-rs
      - name: Run regression
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -o pipefail
          mkdir -p .local/experiments/ci
          if [ "$SCENARIO" = shutdown-recovery ]; then
            cc -shared -fPIC -Wall -Wextra -Werror -O2 tests/e2e/netlink-stall.c \
              -o .local/experiments/ci/netlink-stall.so -ldl
            sudo python3 tests/e2e/netns-shutdown-recovery.py "$PWD/target/release/babel-rs" \
              "$PWD/.local/experiments/ci/netlink-stall.so" 2>&1 | tee .local/experiments/ci/test.log
          else
            sudo python3 "tests/e2e/netns-$SCENARIO.py" "$PWD/target/release/babel-rs" \
              2>&1 | tee .local/experiments/ci/test.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robustness-${{ matrix.scenario }}
          path: .local/experiments/ci/test.log
          include-hidden-files: true
