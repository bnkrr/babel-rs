name: publish crates

on:
  push:
    tags: ['publish/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted && !github.event.forced)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release version and trigger
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python3 scripts/publish.py check --ref "$GITHUB_REF" --dry-run
          else
            python3 scripts/publish.py check --ref "$GITHUB_REF"
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  e2e:
    needs: validate
    uses: ./.github/workflows/e2e.yml

  steady-state:
    needs: validate
    uses: ./.github/workflows/steady-state.yml
    with:
      seconds: '120'

  publish:
    needs: [ci, e2e, steady-state]
    if: github.event_name == 'push' && github.event.created && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup update stable
      - name: Build before acquiring the short-lived credential
        run: cargo +stable build --workspace --locked
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish in dependency order
        run: python3 scripts/publish.py publish --ref "$GITHUB_REF"
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Verify registry consumers
        run: python3 scripts/publish.py verify
        env:
          RUSTUP_TOOLCHAIN: stable
