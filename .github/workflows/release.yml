name: release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted && !github.event.forced)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version, changelog and trigger
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python3 scripts/release.py check --ref "$GITHUB_REF" --dry-run
          else
            python3 scripts/release.py check --ref "$GITHUB_REF"
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  e2e:
    needs: validate
    uses: ./.github/workflows/e2e.yml

  steady-state:
    needs: validate
    uses: ./.github/workflows/steady-state.yml
    with:
      seconds: '120'

  binaries:
    needs: validate
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install native build and network test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools binutils iproute2 iputils-ping
          rustup update stable
          rustup target add "$TARGET"
      - name: Build static bundle
        run: python3 scripts/release.py build --target "$TARGET"
      - name: Test the packaged binary on its native architecture
        run: python3 scripts/release.py smoke --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: .local/experiments/release/assets/*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    needs: [ci, e2e, steady-state, binaries]
    if: github.event_name == 'push' && github.event.created && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: .local/experiments/release/assets
      - name: Publish changelog and verified binary assets
        run: python3 scripts/release.py publish --ref "$GITHUB_REF"
        env:
          GH_TOKEN: ${{ github.token }}
